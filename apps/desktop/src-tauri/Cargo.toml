[package]
name = "emstudio-desktop"
version = "1.6.0-dev.140"
description = "EMStudio desktop shell (Tauri)"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Emanuel Demetrescu <emanuel.demetrescu@cnr.it>"]

# Standalone workspace: keeps the heavy Tauri dependency tree out of the
# root cargo workspace (em-core/em-cli stay lean for CI).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `webview-data-url` · MICRO-I-STAMPA-NEL-DESKTOP: the A4 of a sheet is printed
# from a window of its own whose page is a `data:` URL (main.rs `print_html`) —
# an `about:blank` one reports no page load. One crate more (data-url, from the
# servo/rust-url project); the HTML parser it uses was already in the lock.
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# The OS hands a `stratigraph://` URL to the app; this delivers it as an event
# (frontend: `wireDesktopDeepLink`). Desktop only, and the web build has its own
# way in (the same parameters on its own URL) — which is why the frontend
# resolves this plugin at runtime and carries on without it.
tauri-plugin-deep-link = "2"
# SIGN-IN FROM THE DESKTOP (3 Oct 2026). The sign-in pages open in the SYSTEM
# browser, never in the webview (an embedded webview is a phishing surface, and
# several IdPs refuse it): `opener` is Tauri 2's way to do it (`shell.open` is
# deprecated). The answer comes back on `org.extendedmatrix.emstudio:` — and on
# Windows and Linux a deep link STARTS A SECOND INSTANCE, which does not hold
# the round trip's nonce: `single-instance` with `deep-link` hands the URL to
# the window already open. Registered FIRST in main.rs, as its docs require.
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# MICRO-DOVE-CHI-MENU p.7 · CHECK FOR UPDATES, AND INSTALL. The page decides
# WHICH release (GitHub's list, the channel of the installed version); this
# plugin downloads that release's update, checks its signature against the
# public key in tauri.conf.json, installs it and the app restarts. `semver`
# because the bundle's version is `x.y.z` without `-dev.N` (set-version.mjs):
# "is it newer" is asked of the full version, Cargo's, not of the bundle's.
tauri-plugin-updater = "2"
semver = "1"
# MICRO-PL15 · the bridge's secret: 32 bytes of the OS's randomness (main.rs
# `new_token`). Already in the lock (tauri uses it): no new crate.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── OS keychain, one backend per platform ───────────────────────────────────
#
# The LLM API key is the only secret EMStudio holds, and it must not touch
# em.json, localStorage, or any log — see main.rs.
#
# Declared PER TARGET rather than as one feature list, for two reasons. The
# small one: each OS ships only the backend it can use. The one that actually
# matters: `sync-secret-service` does **not** bring its own encryption — it
# needs `crypto-rust` or `crypto-openssl` for the D-Bus session, and a single
# unconditional feature list that omitted it built fine on macOS and would have
# failed on the first Linux build. `crypto-rust` over `crypto-openssl` so a
# Linux build needs no system OpenSSL.

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# MICRO-PL09 p.0 · a palette's window («Colori», «Vocabolari») made a CHILD of
# the main window (`addChildWindow:ordered:`, main.rs `detached_keep_above`).
# Already in the lock (tao and wry use it): no new crate.
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
