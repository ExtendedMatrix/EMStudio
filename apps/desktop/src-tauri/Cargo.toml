[package]
name = "emstudio-desktop"
version = "1.6.0-dev.12"
description = "EMStudio desktop shell (Tauri)"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Emanuel Demetrescu <emanuel.demetrescu@cnr.it>"]

# Standalone workspace: keeps the heavy Tauri dependency tree out of the
# root cargo workspace (em-core/em-cli stay lean for CI).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# The OS hands a `stratigraph://` URL to the app; this delivers it as an event
# (frontend: `wireDesktopDeepLink`). Desktop only, and the web build has its own
# way in (the same parameters on its own URL) — which is why the frontend
# resolves this plugin at runtime and carries on without it.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── OS keychain, one backend per platform ───────────────────────────────────
#
# The LLM API key is the only secret EMStudio holds, and it must not touch
# em.json, localStorage, or any log — see main.rs.
#
# Declared PER TARGET rather than as one feature list, for two reasons. The
# small one: each OS ships only the backend it can use. The one that actually
# matters: `sync-secret-service` does **not** bring its own encryption — it
# needs `crypto-rust` or `crypto-openssl` for the D-Bus session, and a single
# unconditional feature list that omitted it built fine on macOS and would have
# failed on the first Linux build. `crypto-rust` over `crypto-openssl` so a
# Linux build needs no system OpenSSL.

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
