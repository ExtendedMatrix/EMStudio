# EM dev-stack — a LIGHT local object-storage stack for the Resource layer's
# S3 tier (dev AND local real-work without a remote server).
#
# Default (`up.sh dev`)        = just RustFS (S3) + a one-shot bucket init.
# With auth (`up.sh dev auth`) = adds Keycloak + Postgres (compose profile `auth`).
#
# Reuses Heriverse's S3_* conventions and the shared `heriverse` bucket, so bytes
# land in the SAME keyspace whether local-dev, the full stack, or the remote
# StratiGraph/WP6 deploy. Public images only (no registry auth). Every value has a
# dev default via ${VAR:-default}, so this file validates and runs even with no
# .env — copy .env.example → .env to customise. This is a STANDALONE dev profile;
# it does not modify Heriverse-Docker's production compose.
#
# The S3 server is RustFS (Apache-2.0), the same pinned image as
# stratigraph-server's dev-stack: it speaks plain S3, so s3dgraphy's S3 backend
# (boto3) and every S3 client talk to it unchanged.
#
# NOTE on endpoints: inside this compose network, services reach the store at
# http://rustfs:9000 (used by `rustfs-init` below). A HOST process (em-bridge)
# must use http://localhost:${S3_PORT} — that is what S3_ENDPOINT in .env is for.

services:
  # ── RustFS / S3 object store ─────────────────────────────────────────────────
  rustfs:
    # Pinned, with the digest beside it: a moving tag is an image that changes
    # under your feet; the digest is the name that stays put.
    image: rustfs/rustfs:1.0.2  # sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    container_name: em-dev-rustfs
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"          # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001"  # web console (/rustfs/console/)
    environment:
      # one volume, one disk — a dev node needs no erasure coding
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-password}
    volumes:
      # the image runs as uid 10001 and its /data is 10001's: an empty named
      # volume inherits that owner on first creation, no chown needed
      - rustfs_data:/data
    healthcheck:
      # the readiness endpoint, not a port check (curl is in the image)
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── one-shot: create the shared bucket + turn ON versioning ───────────────────
  # Versioning makes updates non-destructive: a resource keeps its stable ID and
  # the store keeps the object's history. Idempotent — safe to re-run.
  # No extra client image: the rustfs image's curl signs plain S3 calls (SigV4).
  # CreateBucket: 200 = made, 409 (BucketAlreadyOwnedByYou) = already there.
  # PutBucketVersioning is best effort — a refusal is reported, not fatal.
  rustfs-init:
    image: rustfs/rustfs:1.0.2  # sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    container_name: em-dev-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-password}
      S3_BUCKET: ${S3_BUCKET:-heriverse}
    entrypoint:
      - /bin/sh
      - -c
      - |
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
          --aws-sigv4 'aws:amz:us-east-1:s3' \
          --user "$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY" \
          "http://rustfs:9000/$$S3_BUCKET")
        case "$$code" in
          200|409) echo "bucket ready: $$S3_BUCKET ($$code)" ;;
          *) echo "bucket NOT created: HTTP $$code"; exit 1 ;;
        esac
        vcode=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
          --aws-sigv4 'aws:amz:us-east-1:s3' \
          --user "$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY" \
          -H 'Content-Type: application/xml' \
          --data '<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>' \
          "http://rustfs:9000/$$S3_BUCKET?versioning")
        case "$$vcode" in
          200) echo "versioning enabled on $$S3_BUCKET" ;;
          *) echo "versioning NOT enabled on $$S3_BUCKET: HTTP $$vcode (bucket usable)" ;;
        esac

  # ── optional auth (compose profile `auth`) ────────────────────────────────────
  postgres:
    image: postgres:18
    container_name: em-dev-postgres
    profiles: ["auth"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: em-dev-keycloak
    profiles: ["auth"]
    depends_on:
      - postgres
    restart: unless-stopped
    command: ["start-dev"]   # dev mode: HTTP, no TLS, no realm import
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres:5432/keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"

volumes:
  rustfs_data:
  postgres_data:
