# The nightly dev channel: one dev build a night, and only when there is
# something to build.
#
# It is `./em.sh devrel` on a timer — the SAME script a human runs, not a second
# implementation of the release. So the version bump, the tag name, the commit
# message and above all the **s3dgraphy gate** are identical to a hand-made
# release, and a nightly that behaves differently from `devrel` cannot happen by
# drift.
#
# ── three conditions, and each one is a decision ──────────────────────────────
#
# 1. **something changed.** `--if-changed` skips the night when there are no
#    commits since the last tag. A release whose only difference from the previous
#    one is its number teaches testers to ignore the channel.
# 2. **the pinned s3dgraphy is published.** The gate in `em.sh`, unchanged: the
#    desktop app freezes that wheel into its sidecar, so an unpublished pin makes
#    a build nobody can reproduce. (E.D.'s rule, and it is an order: publish the
#    s3dgraphy dev first, then release EMStudio.)
# 3. ~~**this repository.**~~ Era una guardia contro un fork che taggasse
#    a orario. È caduta con l'orologio — e la sua storia sta sul job
#    `prepare`, perché è lì che ha fatto danno.
#
# ── why it CALLS the release workflow instead of just pushing a tag ───────────
#
# A tag pushed with the default `GITHUB_TOKEN` does **not** trigger other
# workflows — GitHub's recursion guard, and the classic way a nightly ends with a
# tag and no builds. The alternative is a personal access token, i.e. a
# long-lived credential in the repository's secrets for a job that needs none.
# So `release.yml` is **reusable** (`workflow_call`) and this calls it directly:
# same jobs, same matrix, same gate, no extra secret.
name: nightly (dev channel)

on:
  # ── LA PIANIFICAZIONE È SPENTA (2 set 2026, decisione di E.D.) ──────────────
  #
  # Il canale dev non esce più da solo ogni notte: si pubblica A MANO, quando
  # qualcuno decide che c'è qualcosa da pubblicare. La ragione non è tecnica ed
  # è bene che stia scritta qui invece che nella memoria di qualcuno: una
  # release che parte da sola è una release che qualcuno deve poi sorvegliare,
  # e il costo di sorvegliarla ogni notte non è ripagato dal ritmo di lavoro di
  # adesso.
  #
  # NON è stato tolto nient'altro. `workflow_dispatch` qui sotto fa partire
  # esattamente lo stesso giro — stesso `./em.sh devrel`, stesso gate
  # s3dgraphy, stessa verifica fra tag e `package.json`, stessi quattro
  # installer costruiti sui runner. Quindi «a mano» significa un bottone, non
  # una build sul portatile: gli installer cross-platform restano.
  #
  # Per riaccenderla: togliere il commento alle due righe qui sotto. (Nota che
  # GitHub disattiva da sé i workflow pianificati in un repo fermo da 60
  # giorni, quindi la loro assenza non è mai una prova che qualcuno abbia
  # deciso — questo commento sì.)
  #
  # schedule:
  #   - cron: "17 3 * * *"   # 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Release even with no commits since the last tag"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    # ── LA GUARDIA È VIA, E VIA CON L'OROLOGIO CHE LA GIUSTIFICAVA ──────────
    #
    # C'era `if: github.repository == '<vecchio-proprietario>/EMStudio'`, e la sua
    # ragione è scritta al punto 3 della testata: «A fork should not tag and
    # push on a schedule». Con lo `schedule:` spento quella frase non ha più
    # soggetto — su un fork il bottone lo preme solo chi ha il fork, e taggare
    # il proprio fork è affar suo.
    #
    # Ma il motivo per cui è via ADESSO è peggiore, ed è misurato: dopo il
    # trasferimento in `ExtendedMatrix` quella condizione è FALSA. Il job
    # veniva saltato, `build` aspettava `prepare` e veniva saltato a sua volta,
    # e il workflow finiva VERDE avendo fatto niente. Un bottone che non fa
    # niente e non lo dice è peggio di un bottone che manca.
    #
    # E nota la forma del guasto: era un LETTERALE con dentro il proprietario.
    # Se una guardia dovesse tornare, va scritta con `github.repository_owner`
    # confrontato con qualcosa che il repo dichiara — mai con una stringa
    # battuta a mano, che il giorno del trasloco nessuno cerca.
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.devrel.outputs.built }}
      tag: ${{ steps.devrel.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the whole history and every tag: `--if-changed` counts commits since
          # the last v* tag, and a shallow clone has no tags to count from
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Who commits the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: ./em.sh devrel (the same script a human runs)
        id: devrel
        shell: bash
        run: |
          set -euo pipefail
          before="$(git tag --points-at HEAD | head -1 || true)"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ./em.sh devrel --yes
          else
            ./em.sh devrel --yes --if-changed
          fi
          after="$(git tag --points-at HEAD | head -1 || true)"
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
            echo "tagged $after"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "nothing to release tonight (no commits since the last tag)"
          fi

  # The three installers, the manual check and the Release — the release workflow
  # itself, called rather than copied.
  build:
    needs: prepare
    if: needs.prepare.outputs.built == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
