# immagine · la web app di EMStudio su GHCR — ACCESA A OGNI TAG
#
# ══ DA QUANDO HA UN `push:` ═════════════════════════════════════════════════
#
# Fino al 18 ottobre 2026 si lanciava solo a mano. Quel giorno E.D. ha deciso di
# pubblicarla, con le immagini del nodo (server, catalogo, StratiField): da allora
# ogni tag `v*` — quello che `./em.sh devrel` spinge per il desktop — pubblica
# anche l'immagine con lo stesso nome.
#
# La ragione per cui era spenta resta vera e va saputa: un pacchetto GHCR NON
# segue il rinomino o il trasferimento del suo repository. Nasce nel namespace
# del proprietario di allora (`ghcr.io/extendedmatrix/`, dal 22 settembre 2026),
# e spostarlo vuol dire cancellarlo e ripubblicarlo, rompendo chi l'ha già
# specchiato (PSNC, sul registry interno del loro OpenShift). Prima di
# trasferire di nuovo questo repository, si spegne il `push:` qui sotto.
#
# A mano si lancia ancora, per un tag già esistente, scrivendo `emstudio`.
#
# ══ IL RESTO ════════════════════════════════════════════════════════════════
#
# Il namespace non è scritto da nessuna parte in questo file: viene da
# `ghcr.io/${{ github.repository }}`, cioè dal proprietario del repo. È così che
# un trasferimento futuro non lascia indietro una riga da ricordarsi.
#
# L'ultimo passo è una tirata ANONIMA — vedi `scripts/verifica-tirata-anonima.sh`
# —, perché al primo push GHCR crea il pacchetto PRIVATO e un job autenticato
# per costruzione non può accorgersene.

name: immagine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      conferma:
        description: >-
          Scrivi `emstudio` per confermare che vuoi davvero PUBBLICARE un
          pacchetto. Un pacchetto pubblicato e poi spostato di namespace è il
          danno che questo cancello esiste per evitare.
        required: true
        type: string
      tag:
        description: 'Il tag di versione da dare all''immagine (es. v1.6.0-dev.10)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  immagine:
    runs-on: ubuntu-24.04

    steps:
      # Il cancello vale per il lancio A MANO: chi pubblica un tag già
      # esistente scrive il nome. Su un tag spinto non c'è niente da
      # confermare — il tag è la conferma.
      - name: Conferma esplicita
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.conferma }}" != "emstudio" ]; then
            echo "::error::Questo workflow pubblica un pacchetto pubblico e non" \
                 "si lancia per sbaglio. Rilancialo scrivendo 'emstudio' nel" \
                 "campo di conferma — e leggi il commento in cima al file su" \
                 "perché non ha un trigger automatico."
            exit 1
          fi

      - uses: actions/checkout@v5

      # QEMU non serve per COSTRUIRE (i due stadi che fanno lavoro vero sono
      # `--platform=$BUILDPLATFORM` e girano nativi, vedi il Dockerfile), ma
      # l'ultimo stadio è per-architettura e buildx lo vuole.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # semver (`v1.6.0-dev.50` → `1.6.0-dev.50`), e niente `latest`:
            # PSNC sceglie per ambiente, dev · stage · production.
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.title=emstudio
            org.opencontainers.image.description=EMStudio — l'editor e il lettore, come web app servita da un nodo.

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Il digest, scritto dove si legge
        run: |
          {
            echo "## ${{ github.repository }}"
            echo
            echo '```'
            echo "digest ${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tag pubblicati:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tirata ANONIMA, e entrambe le architetture
        run: |
          # Un riferimento docker vuole il nome in minuscolo (ExtendedMatrix → extendedmatrix),
          # come lo scrive già docker/metadata-action nei tag.
          ./scripts/verifica-tirata-anonima.sh \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.meta.outputs.version }}"
