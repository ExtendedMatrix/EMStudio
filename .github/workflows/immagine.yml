# immagine · la web app di EMStudio su GHCR — PRONTA E NON ATTIVA
#
# ══ PERCHÉ QUESTO FILE NON HA UN `push:` ════════════════════════════════════
#
# Non è una dimenticanza ed è la cosa più importante da sapere qui dentro.
#
# Un pacchetto GHCR NON segue il rinomino o il trasferimento del suo repository:
# nasce nel namespace del proprietario di allora, e cambiarlo vuol dire
# cancellarlo e ripubblicarlo — cioè rompere chiunque l'abbia già specchiato.
# PSNC specchia le immagini sul registry interno del loro OpenShift: è
# precisamente il caso peggiore.
#
# Il 22 settembre 2026 EMStudio è stato trasferito in `github.com/ExtendedMatrix`
# — la casa della comunità Extended Matrix, che è più longeva del progetto
# StratiGraph e a cui l'editor appartiene. Quindi il namespace di questa
# immagine è `ghcr.io/extendedmatrix/`, distinto da `ghcr.io/stratigraph-eccch/`
# dove stanno le immagini del progetto. Due namespace, e ciascuno dice chi
# risponde dell'artefatto.
#
# Finché E.D. non decide che è il momento, questo workflow si lancia SOLO a
# mano, e solo scrivendo il nome dell'immagine per esteso. Il giorno in cui si
# accende, bastano tre righe:
#
#     on:
#       push:
#         tags:
#           - 'v*'
#
# ══ IL RESTO ════════════════════════════════════════════════════════════════
#
# Il namespace non è scritto da nessuna parte in questo file: viene da
# `ghcr.io/${{ github.repository }}`, cioè dal proprietario del repo. È così che
# un trasferimento futuro non lascia indietro una riga da ricordarsi.
#
# L'ultimo passo è una tirata ANONIMA — vedi `scripts/verifica-tirata-anonima.sh`
# —, perché al primo push GHCR crea il pacchetto PRIVATO e un job autenticato
# per costruzione non può accorgersene.

name: immagine

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: >-
          Scrivi `emstudio` per confermare che vuoi davvero PUBBLICARE un
          pacchetto. Un pacchetto pubblicato e poi spostato di namespace è il
          danno che questo cancello esiste per evitare.
        required: true
        type: string
      tag:
        description: 'Il tag di versione da dare all''immagine (es. v1.6.0-dev.10)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  immagine:
    runs-on: ubuntu-24.04

    steps:
      # Il cancello, e non è una formalità: finché questo workflow non ha un
      # `push:`, l'unico modo di pubblicare è che una persona lo lanci e scriva
      # il nome. Se qualcuno accende il trigger automatico senza togliere
      # questo passo, il job diventa rosso e lo dice invece di pubblicare.
      - name: Conferma esplicita
        run: |
          if [ "${{ inputs.conferma }}" != "emstudio" ]; then
            echo "::error::Questo workflow pubblica un pacchetto pubblico e non" \
                 "si lancia per sbaglio. Rilancialo scrivendo 'emstudio' nel" \
                 "campo di conferma — e leggi il commento in cima al file su" \
                 "perché non ha un trigger automatico."
            exit 1
          fi

      - uses: actions/checkout@v5

      # QEMU non serve per COSTRUIRE (i due stadi che fanno lavoro vero sono
      # `--platform=$BUILDPLATFORM` e girano nativi, vedi il Dockerfile), ma
      # l'ultimo stadio è per-architettura e buildx lo vuole.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.title=emstudio
            org.opencontainers.image.description=EMStudio — l'editor e il lettore, come web app servita da un nodo.

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Il digest, scritto dove si legge
        run: |
          {
            echo "## ${{ github.repository }}"
            echo
            echo '```'
            echo "digest ${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tag pubblicati:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tirata ANONIMA, e entrambe le architetture
        run: |
          ./scripts/verifica-tirata-anonima.sh \
            "ghcr.io/${{ github.repository }}:${{ inputs.tag }}"
